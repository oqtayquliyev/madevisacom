         Privacy: ad storage is off everywhere; in the EEA, UK and Switzerland
         analytics cookies are off too (Google counts those visits cookielessly).

         browser history" setting (on by default). -->

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

        analytics_storage: 'denied',

      });

      gtag('config', 'G-9E4ENDTWY0', { anonymize_ip: true });
    </script>

    <!-- Who MadeVisa is (Organization) and the site's name (WebSite, used by Google for the
