# Renders the Reels written by the content program (scripts/render-reels.mjs).
#
# Runs when the pipeline asks for it (repository_dispatch, sent the moment a
# reel is written — needs the GITHUB_DISPATCH_TOKEN secret in Supabase), every
# hour as a safety net, and by hand (Actions → Render reels → Run workflow).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL                 https://<project>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    Supabase → Project settings → API → service_role
#   PEXELS_API_KEY               optional — stock city footage (pexels.com/api, free)
name: Render reels

on:
  repository_dispatch:
    types: [render-reels]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: render-reels
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Anything to render?
        id: queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Add the repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          auth=(-H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          n=$(curl -sf "$SUPABASE_URL/rest/v1/social_posts?status=eq.rendering&select=id&limit=1" "${auth[@]}" | grep -c '"id"' || true)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          # Report in even when there is nothing to do: the program only plans reels while this workflow is alive.
          curl -sf -X PATCH "$SUPABASE_URL/rest/v1/social_program?id=eq.true" "${auth[@]}" -H "Content-Type: application/json" \
            -d "{\"reels_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            || echo "::warning::Could not report in — has the migration 20261124090000_social_reels.sql been run?"
      - name: Install ffmpeg
        if: steps.queue.outputs.count != '0'
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Render
        if: steps.queue.outputs.count != '0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/render-reels.mjs
