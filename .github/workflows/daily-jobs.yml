# The daily job cycle: reads every company feed in fetcher/companies.json, adds new jobs to the
# Cloudflare D1 database, removes closed / old ones and rebuilds the lists the site serves.
#
# Runs every hour (at :17), and by hand: Actions → "Daily jobs" → "Run workflow".
# Hourly keeps a private repository inside GitHub's 2,000 free minutes a month. If the repository
# is public (Actions are free and unlimited there), change the cron to '*/15 * * * *'.
#
# No secrets needed: the run proves it comes from this repository with GitHub's own short-lived
# sign-in token (OIDC), and madevisa.com/api/sync checks it (worker/sync.ts).
name: Daily jobs

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if a run finished in the last 20 minutes (and read every feed)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch fresh jobs
        run: npx tsx fetcher/run.ts ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
