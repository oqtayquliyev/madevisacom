# The daily job cycle: reads every company feed in fetcher/companies.json, adds new jobs to the
# Cloudflare D1 database, removes closed / old ones and rebuilds the lists the site serves.
#
# Runs every day at 02:23 UTC (06:23 in Baku), and by hand: Actions → "Daily jobs" → "Run workflow".
#
# No secrets needed: the run proves it comes from this repository with GitHub's own short-lived
# sign-in token (OIDC), and madevisa.com/api/sync checks it (worker/sync.ts).
name: Daily jobs

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if a run finished in the last 18 hours'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch fresh jobs
        run: npx tsx fetcher/run.ts ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
